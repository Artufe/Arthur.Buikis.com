name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Planet production bundle budget
        run: node scripts/littlebig-bundle.mjs

      - name: Planet browser regressions
        run: pnpm exec playwright test tests/e2e/planet-review.spec.ts tests/e2e/planet.spec.ts --workers=1

      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: planet-browser-results
          path: test-results/
