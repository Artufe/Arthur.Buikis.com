name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Daily rebuild so the header's GitHub pulse (scripts/github-pulse.mjs) stays current.
  schedule:
    - cron: '17 5 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Refresh GitHub pulse
        # Keeps the committed snapshot if the API call fails. PULSE_TOKEN (optional) is a read-only
        # token for when GITHUB_TOKEN sees fewer contributions than the public profile shows.
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/github-pulse.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PULSE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build

      - name: Copy CNAME into output
        run: cp public/CNAME out/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
